; NoteSphere PHP settings for the vercel-php runtime.
; This file is read by vercel-php and is not shipped to the browser.

memory_limit = 512M
max_execution_time = 60
max_input_time = 60

; Uploads are sent directly to Cloudinary from the browser, so PHP only needs
; to handle small form posts. Keep a modest limit for safety.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 40

display_errors = Off
display_startup_errors = Off
log_errors = On

expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
